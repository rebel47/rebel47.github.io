<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="vault-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="capsule-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <!-- Background Frame -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#0b0f17" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.25" />
  
  <!-- Padlock Shackle / Time Lock Arch -->
  <path d="M36 44 V32 C36 24.2 42.2 18 50 18 C57.8 18 64 24.2 64 32 V44" stroke="url(#vault-grad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Vault / Capsule Body -->
  <rect x="28" y="42" width="44" height="38" rx="10" fill="#141c2e" stroke="url(#vault-grad)" stroke-width="2" />
  
  <!-- Clock / Timer Face inside Lock -->
  <circle cx="50" cy="61" r="11" stroke="url(#vault-grad)" stroke-width="1.8" stroke-dasharray="2 2" />
  <circle cx="50" cy="61" r="2" fill="#fbbf24" />
  <!-- Clock Hands pointing to release time -->
  <path d="M50 61 L50 54" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <path d="M50 61 L56 61" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <!-- Temporal Pulse Ring -->
  <circle cx="50" cy="61" r="15" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3" />
</svg>
