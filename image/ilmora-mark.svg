<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="ilmora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ilmora-core" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Background Frame -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#0b0f17" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.25" />
  
  <!-- Overlapping Elliptical Orbit 1 -->
  <ellipse cx="50" cy="50" rx="32" ry="14" transform="rotate(-30 50 50)" stroke="url(#ilmora-grad)" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Overlapping Elliptical Orbit 2 -->
  <ellipse cx="50" cy="50" rx="32" ry="14" transform="rotate(30 50 50)" stroke="url(#ilmora-grad)" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Orbiting Node Particles -->
  <circle cx="74" cy="36" r="3.5" fill="#6ee7b7" />
  <circle cx="26" cy="64" r="2.5" fill="#34d399" />
  <circle cx="74" cy="64" r="2.5" fill="#34d399" />
  <circle cx="26" cy="36" r="3.5" fill="#6ee7b7" />
  
  <!-- Central On-Device Core / Local Intelligence -->
  <circle cx="50" cy="50" r="10" fill="url(#ilmora-core)" />
  <circle cx="50" cy="50" r="14" stroke="#34d399" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.5" />
  <circle cx="48" cy="48" r="3" fill="#ffffff" fill-opacity="0.8" />
</svg>
