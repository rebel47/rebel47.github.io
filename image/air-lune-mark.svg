<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="lune-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="trail-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <!-- Minimalist Lunar Arc / Atmosphere -->
  <circle cx="50" cy="50" r="44" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2" />
  <path d="M18 64 A 42 42 0 0 1 76 24" stroke="url(#lune-grad)" stroke-width="3" stroke-linecap="round" />
  <!-- Flight trajectory dash -->
  <path d="M26 72 C 38 68, 52 56, 68 38" stroke="url(#trail-grad)" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" />
  <!-- Minimalist Aircraft Vector -->
  <g transform="translate(68, 38) rotate(-45)">
    <path d="M0 -14 L4 -2 L16 3 L16 7 L4 4 L3 12 L8 15 L8 18 L0 16 L-8 18 L-8 15 L-3 12 L-4 4 L-16 7 L-16 3 L-4 -2 Z" fill="#38bdf8" />
    <circle cx="0" cy="-6" r="1.5" fill="#ffffff" />
  </g>
</svg>
